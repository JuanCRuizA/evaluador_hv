services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: evaluador
      POSTGRES_PASSWORD: evaluador
      POSTGRES_DB: evaluador
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evaluador -d evaluador"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://evaluador:evaluador@db:5432/evaluador
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
